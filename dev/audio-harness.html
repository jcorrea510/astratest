<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Meridian Afterglow — audio harness</title>
  <style>
    :root { color-scheme: dark; --bg: #14121c; --panel: #1f1b2b; --ink: #efe7ff; --mute: #a59cbf; --accent: #ff8a5c; }
    body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    h1 { grid-column: 1 / -1; margin: 0; font-size: 20px; }
    section { background: var(--panel); border-radius: 10px; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 14px; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
    button { background: #2c2640; color: var(--ink); border: 1px solid #3d3557; border-radius: 6px; padding: 4px 8px; margin: 2px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    label { display: grid; grid-template-columns: 90px 1fr 40px; align-items: center; gap: 6px; color: var(--mute); }
    #start { grid-column: 1 / -1; font-size: 16px; padding: 10px; background: var(--accent); color: #1b1020; border: none; }
    #status { grid-column: 1 / -1; color: var(--mute); font-family: ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main id="app">
    <h1>Meridian Afterglow — audio harness</h1>
    <button id="start">Start audio (user gesture)</button>
    <div id="status">idle</div>
  </main>
  <script type="module" src="./audio-harness.ts"></script>
</body>
</html>
