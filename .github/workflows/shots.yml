name: Screenshots
# Renders docs/shots/request.json (lab close-ups and in-game views) in a real browser and commits the pictures back to
# the same branch under docs/shots/out/ (the agents' machine has no browser). Triggered by changing the request file.
on:
  push:
    branches: ['claude/**']
    paths: ['docs/shots/request.json', 'docs/shots/perf.json']
permissions:
  contents: write
concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render
        run: |
          npx vite --port 5199 --strictPort > /tmp/vite.log 2>&1 &
          sleep 5
          node scripts/shots.mjs
          if [ -f docs/shots/perf.json ]; then node scripts/perf.mjs || true; fi
      - name: Commit pictures
        run: |
          git config user.name "shots-bot"; git config user.email "shots-bot@users.noreply.github.com"
          git add docs/shots/out
          git commit -m "Screenshots for $(git rev-parse --short HEAD) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
