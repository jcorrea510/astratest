name: iOS app (iPad)
# Builds the web game into the Xcode project, compiles an unsigned iPad .ipa (for Sideloadly / AltStore), and on main
# publishes it on the "ios-latest" GitHub release.
on:
  push:
    branches: [main, claude/game-polish-balance-pu1cvc]
    paths: ['ios/**', '.github/workflows/ios.yml', 'src/**', 'index.html', 'package.json', 'vite.config.*', 'public/**', 'scripts/ios-web.mjs']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: ios-${{ github.ref }}, cancel-in-progress: true }
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the web game into the app (served at app://game/)
        run: npm run ios:web
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Build (unsigned, device SDK)
        run: |
          xcodebuild -project ios/MeridianAfterglow.xcodeproj -scheme MeridianAfterglow -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned .ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/MeridianAfterglow.app ipa/Payload/
          test -f ipa/Payload/MeridianAfterglow.app/game/index.html
          (cd ipa && zip -qry ../MeridianAfterglow-unsigned.ipa Payload)
          ls -lh MeridianAfterglow-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with: { name: MeridianAfterglow-unsigned-ipa, path: MeridianAfterglow-unsigned.ipa }
      - name: Publish to the ios-latest release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest MeridianAfterglow-unsigned.ipa --title "Meridian Afterglow for iPad (unsigned .ipa)" --target ${{ github.sha }} --notes "Unsigned iPad build. It will not install by itself: sideload it with Sideloadly or AltStore (they sign it with your Apple ID, free accounts must re-sign every 7 days), or open ios/MeridianAfterglow.xcodeproj in Xcode (see docs/IOS.md). Built from ${{ github.sha }}."
